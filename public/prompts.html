<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Prompts — CocrIA</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="loading" class="min-h-screen flex items-center justify-center">
    <div class="h-6 w-6 rounded-full border-2 border-primary border-t-transparent animate-spin"></div>
  </div>

  <div id="no-access" class="min-h-screen flex items-center justify-center hidden">
    <div class="card p-8 text-center max-w-sm">
      <p class="text-slate-600 mb-4">Acesso restrito a coordenadores</p>
      <a href="dashboard.html" class="btn-primary">Voltar ao Dashboard</a>
    </div>
  </div>

  <div id="app" class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex items-center gap-4">
          <a href="dashboard.html" class="btn-ghost btn-sm gap-2">
            <span id="icon-back"></span>
            Voltar
          </a>
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Painel de Prompts</h1>
            <p class="text-sm text-slate-500 mt-1">Gerencie os prompts de sistema dos assistentes</p>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="tab-list grid grid-cols-5 mb-8" id="prompt-tabs">
        <button type="button" class="gap-2 tab-active" data-tab-trigger="planning">
          <span class="icon-sparkles"></span><span class="hidden sm:inline">Planejamento</span>
        </button>
        <button type="button" class="gap-2" data-tab-trigger="sources">
          <span class="icon-sparkles"></span><span class="hidden sm:inline">Fontes</span>
        </button>
        <button type="button" class="gap-2" data-tab-trigger="production">
          <span class="icon-sparkles"></span><span class="hidden sm:inline">Produção</span>
        </button>
        <button type="button" class="gap-2" data-tab-trigger="resources">
          <span class="icon-sparkles"></span><span class="hidden sm:inline">Recursos</span>
        </button>
        <button type="button" class="gap-2" data-tab-trigger="knowledge-base">
          <span id="icon-kb"></span><span class="hidden sm:inline">Base de Conhecimento</span>
        </button>
      </div>

      <div id="prompt-content"></div>
    </main>
  </div>

  <div id="toast-root"></div>

  <script src="/js/icons.js"></script>
  <script src="/js/trpc.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/prompts.js"></script>
</body>
</html>
